<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460" role="img" aria-labelledby="title desc">
<title id="title">My Cybersecurity Learning Path</title>
<desc id="desc">Three readable mobile cards show networking foundations, security labs and the future engineering career goal, connected by animated data pulses.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071325"/><stop offset="1" stop-color="#0b2032"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#62d9e6" stop-opacity=".15"/><stop offset=".5" stop-color="#62d9e6"/><stop offset="1" stop-color="#62d9e6" stop-opacity=".15"/></linearGradient></defs>
<rect width="420" height="460" rx="16" fill="url(#bg)" stroke="#2a5668"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="22" y="33" fill="#62d9e6" font-size="13" font-weight="700" letter-spacing="2">MY LEARNING PATH</text>
<g>
<rect x="22" y="53" width="376" height="100" rx="12" fill="#102a3d" stroke="#385e6d"/>
<text x="40" y="78" fill="#79d5df" font-size="12" font-family="monospace">01 // FOUNDATIONS</text>
<text x="40" y="108" fill="#f0f9ff" font-weight="700" font-size="23">NETWORKING</text>
<text x="40" y="135" fill="#a9b8cb" font-size="14">Protocols · VLANs · TCP/IP</text>
</g>
<path d="M210 153V183" stroke="url(#edge)" stroke-width="3"/>
<circle r="4" cx="210" cy="158" fill="#9cf8f6"><animate attributeName="cy" values="158;179;158" dur="2.6s" repeatCount="indefinite"/></circle>
<g>
<rect x="22" y="183" width="376" height="100" rx="12" fill="#102a3d" stroke="#385e6d"/>
<text x="40" y="208" fill="#79d5df" font-size="12" font-family="monospace">02 // HANDS-ON PRACTICE</text>
<text x="40" y="238" fill="#f0f9ff" font-weight="700" font-size="23">SECURITY LABS</text>
<text x="40" y="265" fill="#a9b8cb" font-size="14">Wireshark · Analysis · Labs</text>
</g>
<path d="M210 283V313" stroke="url(#edge)" stroke-width="3"/>
<circle r="4" cx="210" cy="287" fill="#9cf8f6"><animate attributeName="cy" values="287;309;287" dur="2.6s" begin=".7s" repeatCount="indefinite"/></circle>
<g>
<rect x="22" y="313" width="376" height="100" rx="12" fill="#102a3d" stroke="#385e6d"/>
<text x="40" y="338" fill="#79d5df" font-size="12" font-family="monospace">03 // LONG-TERM GOAL</text>
<text x="40" y="368" fill="#f0f9ff" font-weight="700" font-size="23">ENGINEERING</text>
<text x="40" y="395" fill="#a9b8cb" font-size="14">Cybersecurity &amp; network security</text>
</g>
<text x="210" y="441" text-anchor="middle" fill="#6aa3b4" font-family="monospace" font-size="12">Learn  →  Build  →  Improve</text>
</g>
</svg>