<svg xmlns="http://www.w3.org/2000/svg" width="420" height="118" viewBox="0 0 420 118" role="img" aria-labelledby="title desc"><title id="title">Stay curious. Keep building. Stay secure.</title><desc id="desc">A neon cyan mobile-friendly footer with readable text and moving light beams.</desc><defs><linearGradient id="bg"><stop stop-color="#071325"/><stop offset=".5" stop-color="#10283c"/><stop offset="1" stop-color="#071325"/></linearGradient><linearGradient id="beam"><stop stop-color="#62d9e6" stop-opacity="0"/><stop offset=".5" stop-color="#62d9e6"/><stop offset="1" stop-color="#62d9e6" stop-opacity="0"/></linearGradient></defs><rect width="420" height="118" rx="12" fill="url(#bg)" stroke="#285267"/><path d="M18 14H402M18 104H402" stroke="#62d9e6" stroke-opacity=".18"/><rect y="13" x="-130" width="130" height="2" fill="url(#beam)"><animate attributeName="x" values="-130;420" dur="5s" repeatCount="indefinite"/></rect><rect y="103" x="420" width="130" height="2" fill="url(#beam)"><animate attributeName="x" values="420;-130" dur="6s" repeatCount="indefinite"/></rect><g font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle" fill="#eaf1fa"><text x="210" y="43" font-size="21" letter-spacing="1.2">STAY CURIOUS</text><text x="210" y="69" font-size="21" letter-spacing="1.2">KEEP BUILDING</text><text x="210" y="92" font-size="16" letter-spacing="2.5" fill="#75e0e7">STAY SECURE</text></g></svg>