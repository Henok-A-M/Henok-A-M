<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="320" viewBox="0 0 240 320" role="img" aria-labelledby="title desc">
<title id="title">Henok Molla — seamless portrait</title>
<desc id="desc">Original portrait on transparent background with a gentle fade from the shoulders into the surrounding dark GitHub page.</desc>
<defs>
  <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" />
    <stop offset=".53" stop-color="#fff" />
    <stop offset=".70" stop-color="#fff" stop-opacity=".96" />
    <stop offset=".83" stop-color="#fff" stop-opacity=".60" />
    <stop offset=".95" stop-color="#fff" stop-opacity=".13" />
    <stop offset="1" stop-color="#000" />
  </linearGradient>
  <mask id="softFade" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="320">
    <rect width="240" height="320" fill="url(#fadeBottom)" />
  </mask>
  <radialGradient id="aura" cx="73%" cy="39%" r="66%">
    <stop offset="0" stop-color="#62d9e6" stop-opacity=".19" />
    <stop offset=".57" stop-color="#62d9e6" stop-opacity=".05" />
    <stop offset="1" stop-color="#62d9e6" stop-opacity="0" />
  </radialGradient>
</defs>
<ellipse cx="168" cy="146" rx="88" ry="132" fill="url(#aura)">
  <animate attributeName="opacity" values=".45;.85;.45" dur="7s" repeatCount="indefinite" />
</ellipse>
<image x="0" y="0" width="240" height="320" preserveAspectRatio="xMidYMid meet" mask="url(#softFade)" xlink:href="data:image/webp;base64,"/>
</svg>