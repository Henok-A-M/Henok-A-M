<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-labelledby="title desc">
<title id="title">Henok Molla | Network Security</title>
<desc id="desc">Mobile-friendly animated security banner with readable name, cybersecurity focus and neon shield.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071325"/><stop offset="1" stop-color="#0b2032"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1"><stop stop-color="#ecf8ff"/><stop offset="1" stop-color="#74e7ef"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#62d9e6" stroke-opacity=".10" fill="none"/></pattern>
<radialGradient id="glow"><stop stop-color="#62d9e6" stop-opacity=".28"/><stop offset="1" stop-color="#62d9e6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="420" height="236" rx="16" fill="url(#bg)"/>
<rect width="420" height="236" rx="16" fill="url(#grid)"/>
<rect x="1" y="1" width="418" height="234" rx="15" fill="none" stroke="#62d9e6" stroke-opacity=".32"/>
<g font-family="Arial,Helvetica,sans-serif">
<circle cx="28" cy="27" r="4" fill="#66e6c7"><animate attributeName="opacity" values=".3;1;.3" dur="2.3s" repeatCount="indefinite"/></circle>
<text x="41" y="31" font-size="11" letter-spacing="1.6" fill="#8ccbd8">NETWORK / SECURITY</text>
<text x="23" y="90" font-size="42" font-weight="800" letter-spacing="1" fill="url(#name)">HENOK</text>
<text x="23" y="134" font-size="42" font-weight="800" letter-spacing="1" fill="url(#name)">MOLLA</text>
<rect x="24" y="149" width="240" height="2" rx="1" fill="#62d9e6" opacity=".35"/>
<rect x="24" y="149" width="40" height="2" rx="1" fill="#b7f9ff"><animate attributeName="x" values="24;222;24" dur="6s" repeatCount="indefinite"/></rect>
<text x="24" y="177" font-size="17" fill="#c2d5e5">Aspiring Cybersecurity</text>
<text x="24" y="197" font-size="17" fill="#c2d5e5">Engineer</text>
<text x="24" y="221" font-size="10.5" letter-spacing="1.7" fill="#69afc0">LEARN / BUILD / SECURE</text>
</g>
<g transform="translate(340 114)">
<circle r="72" fill="url(#glow)"/>
<circle r="62" fill="none" stroke="#62d9e6" stroke-opacity=".28" stroke-dasharray="6 9">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
</circle>
<circle r="51" fill="#103349" stroke="#62d9e6" stroke-opacity=".30"/>
<path d="M0-32 27-20 23 15Q16 32 0 40-16 32-23 15L-27-20Z" fill="#154459" stroke="#70e5ea" stroke-width="2"/>
<path d="M-13 3 -3 13 16-10" fill="none" stroke="#a4f9ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="0" cy="-50" r="4" fill="#62d9e6"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
</g>
</svg>